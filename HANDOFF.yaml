assumptions:
  description: Each item records what the demonstrations on 2026-11-06 showed.
  items:
    - claim: Queued steering and follow-up messages are lost when the old session is disposed.
      basis: abort() leaves them in arrays on an object that is then discarded.
      status: untested
      evidence: D5 never reached dispose. Pi delivered the follow-up inside the run, and the extension refused the handoff, so nothing was queued at dispose time.
    - claim: Pi 1.5.0 has no session file lock, so a second pi process can resume the source concurrently.
      basis: No lock code found in dist/core/session-manager.js.
      status: untested. Treat as true.
    - claim: Appending the link entry in setup and sending the user message in withSession makes the destination file appear with both entries in one write.
      basis: session-manager.js:786-813 delays the first write until a user message exists.
      status: confirmed in part
      evidence: D3 (kill -9 inside setup, after appendCustomEntry) left no destination file. The final D1 destination holds header, model_change, thinking_level_change, link, system message, user message in that order. The single pass is read from the code, not observed with a syscall trace.
    - claim: "ctx.sendMessage(..., { triggerTurn: true }) from a ReplacedSessionContext starts a run."
      basis: dist/core/extensions/types.d.ts:348-352. Never run.
      status: untested. Not needed, because D-1 uses option A.
    - claim: The model never sees source history in the destination's first provider request.
      status: confirmed
      evidence: out/D2/first-request.json holds one user message, the continuation, and rg finds no ferry code. Later requests contain source excerpts only when the model calls continue_history, by design.
    - claim: The context guard keeps the continuation and every constraint verbatim after compaction, without changing the JSONL.
      status: confirmed
      evidence: out/D7. The continuation entry precedes firstKeptEntryId, the final request starts with the re-inserted continuation, and the JSONL holds one copy.

