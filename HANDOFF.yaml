    - HANDOFF.yaml updates that record new evidence
    - Demonstration artifacts under /tmp/pi-continue-demo/
  out:
    - Unit tests, integration tests and any test using mocks. The owner forbids them without exception.
    - E2E test files, unless the owner asks for them.
    - README or other documentation files, unless the owner asks.
    - Helper scripts or CLIs for repeated chores.
    - Checksums or hash checks. Compare files with cmp or diff.
    - Any upstream change to Pi or Mainplane.
    - LLM-generated summaries of source history. The design forbids them.
  protected:
    - /home/bsa/src/pi-handoff (a different extension. Do not read for design or write)
    - /home/bsa/.pi/agent/sessions (real user sessions. Never write. Demonstrations use --session-dir)
    - P and everything under node_modules (read only)
    - Source session JSONL files during retrieval (read with readFile only, never SessionManager.open)
    - package.json dependencies (ask the owner before adding any package)

contracts:
  custom_entry_types:
    intent: { customType: "pi-continue/intent", written_in: source session }
    link:
      {
        customType: "pi-continue/link",
        written_in: destination session,
        written_by: newSession setup,
      }
  data_shapes: |
    // Define each boundary shape as a pi-schema schema and derive the type with Static<typeof X>.
    type HandoffId = string & { readonly brand: "HandoffId" }; // crypto.randomUUID()
    type SourceRef = {
      file: string;      // absolute JSONL path of the source session
      sessionId: string; // source header id
      leafId: string;    // source leaf when the run settled, read before appending the intent
    };
    type Continuation = {
      handoffId: HandoffId;
      task: string;
      constraints: readonly string[]; // stored and sent verbatim, never rewritten
    };
    type UncertainEffect = {
      toolCallId: string;
      toolName: string;
      entryId: string; // assistant message entry that made the call
      reason: "no-result" | "aborted";
    };
    type IntentEntryData = Continuation & { source: SourceRef; uncertainEffects: readonly UncertainEffect[] };
    type LinkEntryData = Continuation & { source: SourceRef; uncertainEffects: readonly UncertainEffect[] };
    type Excerpt = {
      file: string; sessionId: string; entryId: string; parentId: string | null;
      type: string; role?: string; timestamp: string; text: string; truncated: boolean;
    };
  handoff_state_machine: |
    Rebuild from entries on every session_start. Never keep it only in memory.
    requested   a continue_session tool result exists with details.handoffId
    intended    an intent entry with that handoffId exists in the source
    dispatched  a destination file holds a link entry with that handoffId
  continuation_text: |
    [pi-continue <handoffId>]
    Task:
    <task>
    Active constraints (verbatim):
    - <constraint 1>
    - ...
    Possible effects of interrupted tool calls (check before repeating):
    - <toolName> call <toolCallId> at entry <entryId>: <reason>
    Source: <file>
    Source session ID: <sessionId>
    Source leaf ID: <leafId>
    Prior history is not in this context. Use the continue_history tool to read it.
  continuation_text_rules:
    - The first line is the marker the context guard searches for.
    - Omit the effects section when uncertainEffects is empty.
    - The text must not start with "/", so sendUserMessage never dispatches it as a command.
  tool_continue_session:
    parameters: "obj({ task: str({ minLength: 1 }), constraints: arr(str()) })"
    behaviour: Returns details { handoffId, task, constraints } and text naming the handoff ID. Never calls newSession, because tools run inside an active run.
  command_continue:
    usage: "/continue [handoffId]"
    behaviour: Reads the intent for handoffId (or the latest intent on the current branch), searches for an existing destination, switches to it if found, otherwise calls ctx.newSession.
  tool_continue_history:
    parameters: "obj({ query: opt(str()), entryId: opt(str()), session: opt(str()), around: opt(int({ minimum: 0 })), maxHits: opt(int({ minimum: 1 })), wholeFile: opt(bool()) })"
    defaults: { around: 2, maxHits: 20, wholeFile: false }
    limits: { excerpt_chars: 600, result_chars: 12000, chain_depth: 32 }
    rules:
      - Build the chain only from link entries. Start at the current session's link, read source.file, parse it, follow that file's link. Stop at a missing file, a file without a link, a repeated file, or depth 32.
      - Read with fs.promises.readFile and parseSessionEntries. Never open, resume or write a source file.
      - Accept only headers with version 3. Report others as unsupported.
      - By default search only the branch ending at source.leafId, walking parentId. Search the whole file only when wholeFile is true.
      - Return Excerpt objects with original entry references. Mark truncation.
      - Report skipped items. Missing files, unsupported versions, and malformed line counts (non-empty lines minus parsed entries).
  tool_parameter_pattern: |
    import { compile, int, obj, opt, str } from "@earendil-works/pi-schema";
    const HistoryParams = obj({ query: opt(str()), maxHits: opt(int({ minimum: 1 })) });
    const historyParams = compile(HistoryParams); // once, at module load
    pi.registerTool({
      name: "continue_history",
      parameters: HistoryParams,
      async execute(_id, params) {
        if (!historyParams.check(params)) {
          throw new Error(historyParams.errors(params).map((e) => `${e.path} ${e.message}`).join("; "));
        }
        // params is { query?: string; maxHits?: number } here
      },
    });

flow:
  - step: The model calls continue_session { task, constraints }.
    native: Pi persists the tool result with details.
  - step: agent_settled. Consider only continue_session requests made in this run. Stop with a notice naming the handoff ID if event.aborted, ctx.hasPendingMessages(), or a user message follows the request on the branch (a follow-up delivered inside the run, see D5).
    native: dist/core/agent-session.js:696-718, dist/core/extensions/types.d.ts:263
  - step: Read getSessionFile, getSessionId and getLeafId. Compute uncertainEffects from getBranch(). Then pi.appendEntry("pi-continue/intent", data).
    native: docs/extensions.md:1681
  - step: 'pi.sendUserMessage("/<assigned name> <id>", { expandPromptTemplates: true }). The assigned name comes from pi.getCommands(), because a name collision turns /continue into /continue:N.'
    native: deferred until settled handlers finish (dist/core/agent-session.js:1650)
  - step: /continue searches for an existing destination. Found means ctx.switchSession(path) and stop.
  - step: "ctx.newSession({ parentSession, setup, withSession }). Handle { cancelled: true } with a notice. The old ctx is still valid in that case."
  - step: setup(sm) calls sm.appendCustomEntry("pi-continue/link", linkData). Nothing is on disk yet.
  - step: session_start in the new instance rebuilds state from the link entry.
  - step: withSession(ctx) calls ctx.sendUserMessage(continuationText(link)). The closure captures only plain data.
    native: docs/extensions.md:1471-1478
  - step: The context handler checks the user messages in event.messages for the full continuation text, which starts with "[pi-continue <handoffId>]". If none holds it verbatim, it prepends a user message with the continuation text for that call only. The full text is required because a compaction summary may repeat the marker with paraphrased constraints.

recovery:
  find_existing_destination: |
    candidates = await SessionManager.list(cwd, dirname(intent.source.file))
      .filter(info => info.parentSessionPath === intent.source.file)
    for each candidate:
      entries = parseSessionEntries(await readFile(candidate.path, "utf8"))
      if entries has custom "pi-continue/link" with data.handoffId === id: return candidate.path
    return none
  limits_of_search: Two pi processes running /continue at once can still create two destinations.
  interruptions:
    - when: crash before agent_settled
      source: tool result with handoffId
      destination: none
      next: session_start reports a requested handoff. /continue <id> writes the intent and proceeds.
    - when: crash after intent, before newSession
      source: intent
      destination: none
      next: /continue <id> creates the destination.
    - when: another extension cancels the switch
      source: intent
      destination: none
      next: notify and stop. The old ctx is valid.
    - when: createRuntime throws
      source: intent
      destination: none
      next: user restarts pi and resumes the source. session_start reports the intended handoff.
    - when: crash after setup, before the first message is written
      source: intent
      destination: none (link was only in memory)
      next: /continue <id> creates the destination.
    - when: crash after the first message, before a reply
      source: intent
      destination: header, link, user message
      next: /continue <id> finds it and switches. It never resends the continuation.
    - when: normal completion
      source: intent
      destination: link, message, replies
      next: /continue <id> finds it and switches.
  cancellation_and_queued_input: Refuse while aborted or while messages are queued. The notice tells the user to run /continue <id> when ready.
  uncertain_effects: Walk getBranch() from the leaf. A tool call with no matching result, or whose result came from an abort, goes into uncertainEffects. The extension cannot know whether such a tool changed anything.
  compaction_policy: Compaction does not change the retrieval-only policy. Destination compaction summarizes only destination entries, and the extension never copies source history. The context guard keeps the continuation text verbatim after compaction.

steps:
  - id: S1
    title: Retrieval core and continue_history
    actions:
      - Write the pi-schema schemas for the data shapes, the JSONL reader, the chain walker, the branch walker and the excerpt builder as plain functions that take parsed entries.
      - Register continue_history with the tool parameter pattern.
    done_when:
      - npm run check exits 0.
      - The type check command exits 0.
      - D8 passes against hand-made link entries in copied session files under /tmp/pi-continue-demo.
  - id: S2
    title: /continue with newSession, setup and withSession
    actions:
      - Register /continue. Read the intent, build the link, call ctx.newSession, send the continuation from withSession.
      - Rebuild state on session_start.
    done_when: [D1 passes, D2 passes]
  - id: S3
    title: Existing destination search
    actions:
      [Implement find_existing_destination and switch instead of creating.]
    done_when: [D3 passes, D4 passes]
  - id: S4
    title: continue_session tool and agent_settled dispatch
    actions:
      - Register continue_session.
      - Handle agent_settled with the refusal checks, the intent entry, uncertainEffects and the command dispatch.
    done_when: [D5 passes, D6 passes]
  - id: S5
    title: Compaction guard
    actions: [Add the context handler.]
    done_when: [D7 passes]
  - id: S6
    title: Final verification
    actions:
      [
        Rerun D1 to D8 on the final code. Update HANDOFF.yaml facts and assumptions with the results.,
      ]
    done_when:
      - Every demonstration's artifacts exist under /tmp/pi-continue-demo/out/<id>/.
      - git status --porcelain is empty after the last commit.

demonstrations:
  setup: |
    mkdir -p /tmp/pi-continue-demo/sessions /tmp/pi-continue-demo/out
    cd /home/bsa/src/pi-continue
    PROV=~/.pi/agent/npm/node_modules/@juvio15/pi-cliproxyapi-provider/src/extension/index.ts
    PI_CONTINUE_PAYLOAD_LOG=/tmp/pi-continue-demo/out/<id>/payloads.log \
      pi --mode rpc -ne -nc -ns -np --no-mcp -t continue_history,continue_session -e $PROV -e ./src/extension.ts \
      -e /tmp/pi-continue-demo/payload.ts --session-dir /tmp/pi-continue-demo/sessions/<run>
    # payload.ts is a copy of P/examples/extensions/provider-payload.ts that logs to $PI_CONTINUE_PAYLOAD_LOG.
    # -e $PROV is needed because -ne disables the package that provides the configured model.
    # The command is /continue:2 because the provider package also registers continue (facts.environment).
    # RPC mode drives queued follow-ups (D5), aborts (D6) and compaction (D7). -t adds bash for D6 and read for D7.
  results:
    final_commit: 3a2b544
    D1: pass. out/D1/evidence.jsonl. parentSession equals the source path, one link with handoffId 7d07d61f-a10a-4535-a71f-b4004d37eecc.
    D2: pass. out/D2/first-request.json has one user message, the continuation. out/D2/rg-source-phrase.txt shows no ferry code.
    D3: pass. out/D3/ls-after-kill.txt shows only the source after kill -9 inside setup. out/D3/ls-after-rerun.txt shows one destination.
    D4: pass. out/D4/ls-before.txt equals ls-after.txt, out/D4/session-after.txt is the first destination.
    D5: pass. out/D5/notices.jsonl holds the refusal. out/D5/ls.txt shows only the source, with no intent entry.
    D6: pass. out/D6/ls-marker.txt shows the marker. out/D6/destination-first-user-message.txt lists the aborted bash call.
    D7: pass. out/D7/verbatim-check.txt counts the marker and both constraints once each in out/D7/final-request.json.
    D8: pass. out/D8/tool-results.jsonl hit names the first file and entry 4db2eccd. out/D8/cmp.txt shows both sources identical to their copies.
    D8_interpretation: Three sessions joined by two handoffs. The fact lives only in the first session's transcript.
  rules:
    - Use the real pi binary and a real model. No mocks.
    - Never use the default session directory.
    - Before any retrieval demonstration, copy each source JSONL, then compare with cmp afterwards.
  list:
    - id: D1
      do: Hand off normally.
      evidence: jq -c 'select(.type=="session" or .type=="custom")' on both JSONL files
      expect: destination header parentSession equals the source path, and one link entry carries the source intent's handoffId.
    - id: D2
      do: Capture the destination's first provider request.
      evidence: rg in payloads.log for a phrase that only the source transcript contains
      expect: no match. The continuation text is present.
    - id: D3
      do: Add a temporary 30 second wait inside setup, run kill -9 on pi during it, remove the wait, rerun /continue <id>.
      evidence: ls of the session dir before and after
      expect: no destination file after the kill, and exactly one after the rerun.
    - id: D4
      do: Hand off, then run /continue <id> again.
      evidence: ls and jq
      expect: no second destination. Pi switches to the first.
    - id: D5
      do: Queue a follow-up while a run is active and the model has called continue_session.
      evidence: Pi notice text and ls
      expect: handoff refused, no destination.
    - id: D6
      do: Have a bash call write /tmp/pi-continue-demo/marker and sleep, abort during the call, then hand off.
      evidence: ls of the marker and the destination's first user message
      expect: the marker exists, and the continuation lists that call as an interrupted effect.
    - id: D7
      do: Run /compact in the destination, then send a message and capture the request.
      evidence: payloads.log
      expect: '"[pi-continue <id>]" and every constraint appear verbatim.'
    - id: D8
      do: Chain three continuations, then ask the model to find a fact stated only in the first session.
      evidence: continue_history tool result in the JSONL, and cmp of each source file against its copy
      expect: the hit names the first session's file and entry ID, and cmp prints nothing.

commands:
  install: npm ci
  lint_and_format_check: npm run check
  fix: npx ultracite fix
  doctor: npx ultracite doctor # last result 8 passed, 0 warnings, 0 failed
  type_check: npx -y -p @typescript/native-preview tsgo -p . # transient download, not a dependency. See decision D-5
  bun_check: rg -n -i bun --hidden -g '!node_modules' -g '!.git' -g '!package-lock.json' -g '!HANDOFF.yaml' . # must print nothing. HANDOFF.yaml is excluded because it records the npm decision and this command itself
  commit: git commit # Lefthook pre-commit runs npx ultracite fix on staged files and restages them

execution_constraints:
  - Use rg for text search, fd for file search, jq for JSON, read files directly when the path is known.
  - Use npm, never Bun.
  - Ask the owner before adding any package.
  - No unit, integration or mock tests. Prove behaviour by running the real pi binary.
  - Do not create documentation files other than HANDOFF.yaml updates.
  - Commit in small units, one per step, each after its checks pass.
  - Never claim an atomic handoff, complete recall or exactly-once tool effects.

blockers: []

decisions_needed:
  description: Each item has a default. Apply the default and report it. The owner may override any of them later.
  items:
    - id: D-0
      question: May the agent run demonstrations D1 to D8 against a real model?
      default: Yes. They write only under /tmp/pi-continue-demo, which is reversible. Use whatever model pi is already configured with.
      applied: Yes, with cliproxyapi/claude-opus-5-5 at thinking level high, loaded through an explicit -e of its provider package.
    - id: D-1
      default: A
      question: When /continue finds a destination whose last message is the unanswered continuation, what happens?
      options:
        A: Switch and notify. Start nothing. (recommended. No assumption needed)
        B: 'Switch and start a run with ctx.sendMessage({ customType: "pi-continue/resume" }, { triggerTurn: true }). (untested)'
      applied: A
    - id: D-2
      default: A
      question: Who may start a handoff?
      options:
        A: The model through continue_session, and the user through /continue. (recommended)
        B: Only the user through /continue.
      applied: A
    - id: D-3
      question: Are the retrieval limits right? excerpt 600 chars, result 12000 chars, 20 hits, chain depth 32.
      default: Keep them until D8, then adjust.
      applied: Kept. D8 found the fact in two calls, the second with 2 hits, far below every limit, so no evidence asks for a change.
    - id: D-4
      default: A
      question: Should the context guard re-inject the continuation after compaction, or should a session_before_compact handler supply a summary that contains it?
      options:
        A: context guard, which changes only the request, not the JSONL. (recommended)
        B: custom compaction summary
      applied: A
    - id: D-5
      question: Add @typescript/native-preview as a devDependency with a typecheck script, or keep the transient npx command?
      default: Keep the transient command until the owner answers.
      applied: Kept the transient npx command.
    - id: D-6
      question: The cliproxyapi provider also registers /continue, so users must type /continue:2. Rename this command, or keep the contract name?
      default: Keep "continue". The extension finds its assigned name with pi.getCommands() for its own dispatch and notices, so the model path works either way.
      applied: default
      options:
        A: Keep continue and accept /continue:2 while that provider is installed.
        B: Rename to a name no installed package uses, such as handoff-continue.

report_back:
  - Commits made, one line each with hash and message.
  - For each step S1 to S6, pass or fail with the command output that proves it.
  - For each demonstration D1 to D8, pass, fail or not run, with the artifact path under /tmp/pi-continue-demo/out/.
  - Each assumption above, marked confirmed, refuted or untested, with evidence.
  - Any new fact found in Pi source, with file and line.
  - The option applied for each of D-0 to D-5, and any owner override, quoted.
  - Anything left unfinished and why.
