facts:
  description: Established by reading installed source. Each item names its evidence.
  pi_lifecycle:
    - claim: newSession runs session_before_switch, creates the SessionManager, sets parentSession, aborts the old run, emits session_shutdown, disposes, creates the runtime, runs setup then refreshContext, rebinds (which emits session_start in the new extension instance), then runs withSession.
      evidence:
        [
          dist/core/agent-session-runtime.js:147-173,
          dist/core/agent-session-runtime.js:102-113,
          dist/core/agent-session-runtime.js:120-127,
          dist/core/agent-session.js:2698,
        ]
    - claim: "Any extension can cancel newSession through session_before_switch, which returns { cancelled: true }."
      evidence: [dist/core/agent-session-runtime.js:148-151]
    - claim: The destination session lives in the source's session directory.
      evidence: [dist/core/agent-session-runtime.js:153-156]
    - claim: A new session file is not created until the session holds a user or assistant message. Pi then writes every pending entry in one pass with open flag "wx", and appends afterwards.
      evidence: [dist/core/session-manager.js:786-813]
    - claim: parentSession is only a header field holding a path.
      evidence:
        [
          dist/core/session-manager.js:692-716,
          dist/core/session-manager.d.ts SessionHeader,
        ]
    - claim: Dispose invalidates the old extension ctx. Captured old pi or ctx objects throw after replacement. withSession receives a fresh ReplacedSessionContext with sendMessage and sendUserMessage.
      evidence:
        [
          dist/core/agent-session.js:1024-1035,
          dist/core/extensions/runner.js:482,
          dist/core/extensions/types.d.ts:348-357,
          docs/extensions.md:1471-1478,
        ]
    - claim: If createRuntime throws, the old session is already disposed. Interactive mode shows a fatal error and does not roll back.
      evidence:
        [
          dist/core/agent-session-runtime.js:160-161,
          dist/modes/interactive/interactive-mode.js:1571-1578,
          dist/modes/interactive/interactive-mode.js:1696-1706,
        ]
    - claim: Teardown awaits abort(), so the aborted turn and its tool results are persisted to the old JSONL. External side effects of tools are not recorded anywhere.
      evidence: [dist/core/agent-session-runtime.js:103-105]
    - claim: Steering, follow-up and nextTurn messages live only in memory arrays.
      evidence:
        [
          dist/core/agent-session.js:105-111,
          dist/core/agent-session.js:1814,
          dist/core/agent-session.js:1830,
          dist/core/agent-session.js:1529-1531,
        ]
    - claim: agent_settled fires once Pi will not continue automatically. Its event carries aborted. ctx.isIdle() is true inside it.
      evidence: [dist/core/agent-session.js:696-718, docs/extensions.md:663-695]
    - claim: A prompt sent during agent_settled is deferred until every settled handler finishes.
      evidence: [dist/core/agent-session.js:1650-1652]
    - claim: sendUserMessage dispatches extension commands only with expandPromptTemplates true. The default is false, so "/cmd" would otherwise reach the model as text.
      evidence:
        [
          dist/core/agent-session.js:1950-1951,
          dist/core/extensions/types.d.ts:1288-1292,
        ]
    - claim: ctx.hasPendingMessages() reports queued steering or follow-up messages.
      evidence: [dist/core/extensions/types.d.ts:263]
    - claim: pi.appendEntry writes a custom entry that never enters model context.
      evidence: [docs/extensions.md:1681-1698]
    - claim: SessionManager exposes getSessionFile, getSessionId, getSessionDir, getLeafId, getBranch, getEntries, getHeader and appendCustomEntry.
      evidence: [dist/core/session-manager.d.ts:251-341]
    - claim: SessionManager.list returns parentSessionPath per session, but not custom entries.
