  name: pi-continue
  written: 2026-11-06
  status_summary: >
    Steps S1 to S6 are done. src/ implements continue_history, /continue, continue_session, the agent_settled dispatch, the session_start report and the context guard. D1 to D8 passed on commit 3a2b544 with the real pi binary and cliproxyapi/claude-opus-5-5. Artifacts are under /tmp/pi-continue-demo/out/<id>/, with earlier step runs in out/<id>/during-steps/. Open owner question: the /continue name collides with the cliproxyapi provider (see facts.environment).

goal:
  user_goal: >
    Start each Pi continuation in a fresh session that carries no prior transcript and no summary. The new session receives only the current task, the exact active constraints, and a reference to its source (session file, session ID, finalized leaf ID). Prior history stays on disk and the model reads it on demand through a read-only tool that follows explicit source links across successive continuations.
  form: A self-contained Pi extension. No change to Pi and no upstream PR, ever.
  smallest_deliverable: >
    src/extension.ts implementing the continue_session tool, the /continue command, the agent_settled and session_start handlers, the context compaction guard, and the continue_history retrieval tool, each proven by running the real pi binary.

